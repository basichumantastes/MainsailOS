# ============================================================================
# PRINTER.CFG CLEAN - ENDER 3 PRO + BLTOUCH - MAINSAILOS CUSTOM
# ============================================================================
# Configuration propre avec tous les paramètres calibrés
# Basé sur Creality 4.2.2 board (STM32F103)
# BLTouch installé et calibré
# Extrudeur métal Creality + Bowden Capricorn
# Optimisé pour MainsailOS
# ============================================================================

# === VIRTUAL SD CARD ===
[virtual_sdcard]
path: ~/printer_data/gcodes

# === DISPLAY STATUS ===
[display_status]

# === EXCLUDE OBJECT ===
[exclude_object]

# === PAUSE RESUME ===
[pause_resume]

# ============================================================================
# MACROS PAUSE/RESUME/CANCEL - OPTIMISÉES MAINSAIL
# ============================================================================

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head to park position
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  M107 ; turn off fan
  ## Clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

# ============================================================================
# MACROS START/END PRINT - OPTIMISÉES MAINSAIL
# ============================================================================

[gcode_macro START_PRINT]
description: Start print macro with bed mesh and proper heating
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(205)|float %}
  
  # Clear pause_next_layer and pause_at_layer as preparation for new print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  
  # Start bed heating (but don't wait)
  M140 S{BED_TEMP}
  
  # Use absolute coordinates
  G90
  
  # Extruder relative mode
  M83
  
  # Home all axes
  G28
  
  # Load bed mesh (calibré)
  BED_MESH_PROFILE LOAD=default
  
  # Wait for bed temperature
  M190 S{BED_TEMP}
  
  # Set and wait for extruder temperature
  M109 S{EXTRUDER_TEMP}
  
  # Move to purge position
  G1 Z5 F6000
  G1 X10 Y5 F6000
  
  # Purge line
  G92 E0
  G1 E5 F180                    # Small purge
  G1 X150 E15 F1000             # Purge line
  G92 E0                        # Reset extruder
  
  # Ready to print
  M117 Printing...

[gcode_macro END_PRINT]
description: End print macro
gcode:
  # Relative positioning
  G91
  
  # Retract and move away
  G1 E-3 F1800
  G1 Z+5 F6000
  
  # Absolute positioning
  G90
  
  # Park position
  G1 X10 Y200 F6000
  
  # Turn off heaters and fan
  M104 S0
  M140 S0
  M106 S0
  
  # Clear display
  M117
  
  # Disable steppers after 10 minutes
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTER_OFF DURATION=600

[delayed_gcode DELAYED_PRINTER_OFF]
initial_duration: 0.
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    M84 ; disable steppers
  {% endif %}

# ============================================================================
# STEPPER MOTORS - ENDER 3 PRO
# ============================================================================

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 245
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 226
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -6.0

# ============================================================================
# EXTRUDEUR - CALIBRÉ
# ============================================================================

[extruder]
max_extrude_only_distance: 100.0
max_extrude_cross_section: 5
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 32.575        # CALIBRÉ (était 33.778)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

# ============================================================================
# HEATED BED
# ============================================================================

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# ============================================================================
# FAN
# ============================================================================

[fan]
pin: PA0

# ============================================================================
# MCU - ADAPTÉE POUR RASPBERRY PI
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

# Alternative si le serial by-id ne fonctionne pas :
# serial: /dev/ttyUSB0

# ============================================================================
# PRINTER KINEMATICS
# ============================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# ============================================================================
# BLTOUCH - CALIBRÉ
# ============================================================================

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
x_offset: -42.5
y_offset: -9
samples: 2
speed: 20
z_offset: 4.115                 # CALIBRÉ ET VALIDÉ

# ============================================================================
# SAFE Z HOME
# ============================================================================

[safe_z_home]
home_xy_position: 125,125
speed: 200
z_hop: 8
z_hop_speed: 200

# ============================================================================
# BED MESH - CALIBRÉ
# ============================================================================

[bed_mesh]
speed: 200
horizontal_move_z: 10
mesh_min: 5.5, 7
mesh_max: 200.5, 217
probe_count: 5, 5
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0

# ============================================================================
# DISPLAY (si présent)
# ============================================================================

[display]
lcd_type: st7920
cs_pin: PB12
sclk_pin: PB13
sid_pin: PB15
encoder_pins: ^PB14, ^PB10
click_pin: ^!PB2

# ============================================================================
# SCREWS TILT ADJUST
# ============================================================================

[screws_tilt_adjust]
screw1: 71, 38
screw1_name: front left screw
screw2: 242,38
screw2_name: front right screw
screw3: 242, 208
screw3_name: rear right screw
screw4: 71, 208
screw4_name: rear left screw
horizontal_move_z: 10
speed: 250
screw_thread: CW-M3

# ============================================================================
# FIRMWARE RETRACTION - VALIDÉE
# ============================================================================

[firmware_retraction]
retract_length: 3
retract_speed: 40
# unretract_extra_length: 0
# unretract_speed: 10

# ============================================================================
# MACROS UTILITAIRES POUR MAINSAIL
# ============================================================================

[gcode_macro LOAD_FILAMENT]
description: Load filament helper
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83                            ; set extruder to relative
    G1 E45 F300                    ; load
    G1 E15 F150                    ; prime nozzle with filament
    M82                            ; set extruder to absolute
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament helper
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83                            ; set extruder to relative
    G1 E10 F300                    ; extrude a little to soften tip
    G1 E-50 F1800                  ; retract filament completely
    M82                            ; set extruder to absolute
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}

